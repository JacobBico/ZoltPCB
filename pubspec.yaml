name: zolt
description: "Mobile schematic capture and PCB layout, in and out of KiCad."
# Private: never published to pub.dev.
publish_to: 'none'

# versionName+versionCode on Android. The code must go up for every build
# installed over an older one from a store.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  drift: ^2.28.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.24
  flutter_riverpod: ^3.0.0
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  file_picker: ^12.2.0
  share_plus: ^13.3.0
  archive: ^4.2.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.31.0
  # Host tests open the system SQLite directly; see
  # test/flutter_test_config.dart.
  sqlite3: ^2.9.4
  meta: ^1.17.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/logo.svg
    - assets/fonts/
    - assets/changelog.md
    # Learn: every folder of notes is listed, since Flutter does not look
    # inside folders on its own. A new topic needs its folder added here.
    - assets/learn/
    - assets/learn/digital/
    - assets/learn/decoupling/
    - assets/learn/routing/
    - assets/learn/grounding/
    - assets/learn/high-speed/
    - assets/learn/fabrication/
