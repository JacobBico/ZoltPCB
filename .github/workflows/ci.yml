# Analyze and test every push and pull request.
#
# The `kicad` and `corpus` suites need a KiCad install and skip themselves
# here; run them locally after touching the parser or the exporters.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
          cache: true

      # Host tests use the system SQLite; see test/flutter_test_config.dart.
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
