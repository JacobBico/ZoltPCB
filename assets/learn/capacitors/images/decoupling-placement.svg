<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330">
  <rect x="0" y="0" width="600" height="330" rx="12" fill="#161a24"/>
  <rect x="24" y="24" width="552" height="258" rx="8" fill="#12382a"/>
  <!-- supply coming in, through the capacitor pad first -->
  <polyline points="576,100 358,100" fill="none" stroke="#d88a36" stroke-width="7" stroke-linecap="round"/>
  <polyline points="358,100 340,100 331,109 316,109" fill="none" stroke="#d88a36" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- capacitor ground to its via -->
  <line x1="358" y1="146" x2="358" y2="166" stroke="#d88a36" stroke-width="7" stroke-linecap="round"/>
  <!-- chip ground pin to its via -->
  <line x1="150" y1="214" x2="118" y2="214" stroke="#d88a36" stroke-width="7" stroke-linecap="round"/>
  <!-- chip -->
  <rect x="176" y="88" width="116" height="140" rx="4" fill="#1d2026"/>
  <circle cx="192" cy="102" r="5" fill="#3a3f49"/>
  <text x="234" y="164" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e6e8ee" text-anchor="middle">U1</text>
  <!-- pads -->
  <rect x="142" y="100" width="30" height="18" rx="2" fill="#d9dde3"/>
  <rect x="142" y="135" width="30" height="18" rx="2" fill="#d9dde3"/>
  <rect x="142" y="170" width="30" height="18" rx="2" fill="#d9dde3"/>
  <rect x="142" y="205" width="30" height="18" rx="2" fill="#d9dde3"/>
  <rect x="296" y="100" width="30" height="18" rx="2" fill="#d9dde3"/>
  <rect x="296" y="135" width="30" height="18" rx="2" fill="#d9dde3"/>
  <rect x="296" y="170" width="30" height="18" rx="2" fill="#d9dde3"/>
  <rect x="296" y="205" width="30" height="18" rx="2" fill="#d9dde3"/>
  <!-- capacitor, 0603 -->
  <rect x="346" y="90" width="24" height="18" rx="2" fill="#d9dde3"/>
  <rect x="349" y="108" width="18" height="20" fill="#c9a877"/>
  <rect x="346" y="128" width="24" height="18" rx="2" fill="#d9dde3"/>
  <!-- vias -->
  <circle cx="358" cy="172" r="8" fill="#d9dde3"/>
  <circle cx="358" cy="172" r="3.5" fill="#0b1f16"/>
  <circle cx="112" cy="214" r="8" fill="#d9dde3"/>
  <circle cx="112" cy="214" r="3.5" fill="#0b1f16"/>
  <!-- the loop to keep small -->
  <rect x="290" y="80" width="96" height="106" rx="10" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 5"/>
  <!-- labels -->
  <text x="540" y="90" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f2b366" text-anchor="end">VDD in</text>
  <text x="394" y="123" font-family="sans-serif" font-size="13" fill="#e6e8ee">100 nF</text>
  <text x="394" y="176" font-family="sans-serif" font-size="12" fill="#e6e8ee">GND via</text>
  <text x="284" y="113" font-family="sans-serif" font-size="11" fill="#9aa3b5" text-anchor="end">VDD</text>
  <text x="184" y="218" font-family="sans-serif" font-size="11" fill="#9aa3b5">GND</text>
  <text x="112" y="240" font-family="sans-serif" font-size="12" fill="#e6e8ee" text-anchor="middle">GND via</text>
  <text x="394" y="206" font-family="sans-serif" font-size="12" fill="#ffd166">Keep this loop small</text>
  <text x="300" y="310" font-family="sans-serif" font-size="12" fill="#9aa3b5" text-anchor="middle">Power reaches the capacitor first, then the pin; the capacitor goes straight down to ground</text>
</svg>
